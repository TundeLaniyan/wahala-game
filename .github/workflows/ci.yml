name: CI

# Release path (docs/CI.md):
#   plan + fast checks (typecheck/lint, unit tests, one production build) -> E2E shards in parallel, each on
#   its own runner serving that same build -> merged report (every listed test ran exactly once) -> CI gate
#   -> deploy (only the publishing branch, only this commit, only after the gate).
# A commit whose only changes since the last verified commit are documentation runs the fast checks and
# skips the browser suite and the deploy (scripts/ci/plan.ts).
on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]
  workflow_dispatch:
    inputs:
      shards:
        description: Number of E2E shards (separate runners)
        type: choice
        options: ['4', '6', '8', '10', '12', '14']
        default: '14'
      workers:
        description: Playwright workers per shard
        type: choice
        options: ['1', '2']
        default: '1'
      online_e2e:
        description: Also run the online two-browser check (development-only server, never published)
        type: boolean
        default: false

# Two classes of run (decision FU2-CI6), so that competing full runs do not exhaust the account's runners:
#   - the publishing branch: its own group; a newer push supersedes the older run (a cancelled run never deploys);
#   - every other branch: ONE shared group, queued, never cancelled in progress: a second branch's run waits for the first
#     (a third replaces the one still waiting); a pull request keeps its own group and supersedes itself.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || (github.ref == 'refs/heads/claude/wahala-stitch-uiux-v1' && 'ci-release' || 'ci-feature') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/claude/wahala-stitch-uiux-v1' }}

permissions:
  contents: read
  actions: read

env:
  E2E_SHARDS: '14'
  E2E_WORKERS: '1'
  UNIT_SHARDS: '4'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      shards: ${{ steps.matrix.outputs.shards }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      workers: ${{ steps.matrix.outputs.workers }}
      unit_shards: ${{ steps.matrix.outputs.unit_shards }}
      unit_matrix: ${{ steps.matrix.outputs.unit_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node --experimental-strip-types scripts/ci/plan.ts
      - id: matrix
        env:
          SHARDS: ${{ inputs.shards || env.E2E_SHARDS }}
          WORKERS: ${{ inputs.workers || env.E2E_WORKERS }}
        run: |
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"
          echo "matrix=$(seq -s, 1 "$SHARDS" | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"
          echo "unit_shards=$UNIT_SHARDS" >> "$GITHUB_OUTPUT"
          echo "unit_matrix=$(seq -s, 1 "$UNIT_SHARDS" | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"
      # duration-balanced unit shards (scripts/ci/unit-shards.ts). Every run, docs-only ones too: the unit tests are
      # mandatory in the gate. Needs no dependencies, so it does not wait for npm ci.
      - name: Split the unit tests into shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timings=scripts/ci/unit-timings.seed.json
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=unit-timings&per_page=10" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' || true)
          if [ -n "$run" ] && gh run download "$run" -n unit-timings -D unit-timings -R "$GITHUB_REPOSITORY"; then
            timings=unit-timings/unit-timings.json
            echo "durations from run $run"
          else
            echo "no recorded durations: the committed seed"
          fi
          node --experimental-strip-types scripts/ci/unit-shards.ts split "$timings" "$UNIT_SHARDS" unit-lists
      - uses: actions/upload-artifact@v4
        with:
          name: unit-lists
          path: unit-lists
          if-no-files-found: error
          retention-days: 7
      # duration-balanced shards: every listed test in exactly one shard (scripts/ci/shards.ts)
      - if: steps.plan.outputs.full == 'true'
        run: npm ci
      - if: steps.plan.outputs.full == 'true'
        name: Per-test durations of the last fully passing suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-timings&per_page=10" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' || true)
          if [ -n "$run" ] && gh run download "$run" -n e2e-timings -D timings -R "$GITHUB_REPOSITORY"; then
            echo "durations from run $run"
          else
            echo "no recorded durations: every test counts the same"
          fi
      - if: steps.plan.outputs.full == 'true'
        name: Split the suite into shards
        run: |
          npx playwright test --list --reporter=json > listed.json
          timings=timings/e2e-timings.json; [ -f "$timings" ] || timings=-
          node --experimental-strip-types scripts/ci/shards.ts split listed.json "$timings" "${{ steps.matrix.outputs.shards }}" shard-lists
      - if: steps.plan.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shard-lists
          path: shard-lists
          if-no-files-found: error
          retention-days: 7

  # installs the browser and its system packages once and caches them for the shards (runs beside the checks)
  browser:
    name: Browser cache
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browser
        with:
          save: 'true'

  quality:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # The unit tests ran as one job of 15-20 minutes against a 20-minute limit (run 330 was cancelled at 20m15s) and the
  # browser shards waited for it. Now: UNIT_SHARDS runners, each a duration-balanced slice (the plan job), and the
  # `unit` job below, the one the CI gate reads, which checks every test file ran exactly once and nothing failed.
  unit-shard:
    name: Unit shard ${{ matrix.shard }}/${{ needs.plan.outputs.unit_shards }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.unit_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: unit-lists
          path: unit-lists
      - name: This shard's test files
        run: npx vitest run $(cat unit-lists/unit-${{ matrix.shard }}.txt) --reporter=default --reporter=json --outputFile.json=unit-report-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-report-${{ matrix.shard }}
          path: unit-report-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

  unit:
    name: Unit tests
    needs: [plan, unit-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: unit-lists
          path: unit-lists
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: unit-report-*
          path: unit-lists
          merge-multiple: true
      - name: Every shard passed and every test file ran exactly once
        env:
          SHARDS: ${{ needs.unit-shard.result }}
        run: |
          fail=0
          [ "$SHARDS" = success ] || { echo "::error::the unit shards finished as: $SHARDS"; fail=1; }
          node --experimental-strip-types scripts/ci/unit-shards.ts verify "$UNIT_SHARDS" unit-lists unit-timings.json unit-lists/timings-used.json || fail=1
          exit $fail
      # per-file durations of this run laid over the previous ones: the next run's unit plan (kept even when a shard failed)
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('unit-timings.json') != ''
        with:
          name: unit-timings
          path: unit-timings.json
          retention-days: 30

  # The City Rumble server package (server/): its own npm package, tested here and never started, deployed or reachable.
  # It runs the real simulation and real in-process sockets on the runner's loopback, so it needs no backend, secret or
  # network service, and it does not touch the browser shards. Development-only: the public build never contains it.
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            player-platform/package-lock.json
      # the server scripts use the root toolchain (tsx, tsc, vitest) and import the simulation from ../src
      - run: npm ci
      - run: npm ci
        working-directory: server
      # the match server imports the platform's ticket verifier, and the wired integration test needs both packages
      - run: npm ci
        working-directory: player-platform
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run typecheck
        working-directory: player-platform
      - run: npm test
        working-directory: player-platform

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc --noEmit && vite build`; the type check is the quality job's
      - run: npx vite build
      # every E2E shard and the deploy use exactly this build of this commit
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  e2e:
    name: E2E shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}
    # not `unit` (decision FU2-CI5): the shards need only the build, the shard lists and the browser cache; the unit
    # tests run beside them and stay mandatory in the CI gate (a failing unit job still stops the deploy)
    needs: [plan, quality, build, browser]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      WAHALA_E2E_PREBUILT: '1'
      WAHALA_E2E_WORKERS: ${{ needs.plan.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: shard-lists
          path: shard-lists
      # the tests run headless, which is the headless shell; the full browser is not needed
      - uses: ./.github/actions/playwright-browser
      # software WebGL speed follows the runner's CPU, which varies between runs: keep it in the log
      - name: Runner
        run: |
          echo "$(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p'), $(free -g | awk '/Mem:/ {print $2}') GB"
      # this shard's tests from the plan; --fully-parallel lets a shard's workers share a file (every test
      # has its own browser context; no spec shares state between tests)
      - run: npx playwright test --test-list shard-lists/shard-${{ matrix.shard }}.txt --fully-parallel
        timeout-minutes: 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 14

  e2e-report:
    name: E2E report
    needs: [plan, e2e]
    if: ${{ !cancelled() && needs.plan.outputs.full == 'true' && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge the shard reports (HTML with traces and screenshots, JSON)
        id: merge
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      # Per-test durations for the next run's shard plan (decision FU2-CI4): what this run measured (every attempt of a
      # test added up) laid over the previous durations, so a test this run did not reach keeps its last known one. It runs
      # whenever a report was merged, BEFORE the check below can fail the job: a run with a timed-out shard used to leave
      # the plan on the durations of the last fully green suite.
      - name: Per-test durations (this run over the previous ones)
        if: always() && steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=-
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-timings&per_page=10" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' || true)
          if [ -n "$run" ] && gh run download "$run" -n e2e-timings -D previous-timings -R "$GITHUB_REPOSITORY"; then
            prev=previous-timings/e2e-timings.json
          fi
          node --experimental-strip-types scripts/ci/shards.ts timings merged.json e2e-timings.json "$prev"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('e2e-timings.json') != ''
        with:
          name: e2e-timings
          path: e2e-timings.json
          retention-days: 30
      - name: Every listed test ran exactly once; totals, flaky tests
        run: |
          npx playwright test --list --reporter=json > listed.json
          node --experimental-strip-types scripts/ci/report.ts tests listed.json merged.json
      - name: Timings
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/report.ts timings

  # City Rumble online, two real browsers against the real (development-only) server on localhost: the integration check
  # that docs/CITY_RUMBLE_ONLINE.md section 7.9 describes. It is its own job on its own runner, so it can neither slow nor
  # share CPU with the browser shards; it runs only when the change touches the online code or when asked for
  # (workflow_dispatch input `online_e2e`); it builds the SERVER build into dist-online (never the public `dist`),
  # publishes nothing, starts no service outside the runner, and is NOT an input of the gate or of the deploy: the public
  # build never contains online code (scripts/check-static-build.mjs, tests/online/public-bundle.test.ts), and a red run
  # here is read, not retried. The runner script pins the server and the browsers to different CPUs, samples the server's
  # own event-loop delay and dropped ticks during the run, and fails when the SERVER stalled (a stalled server makes the
  # browser result meaningless), without retrying anything.
  online-e2e:
    name: Online e2e (two browsers, not required)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          FORCED: ${{ inputs.online_e2e }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=false
          if [ "$FORCED" = true ]; then run=true
          else
            base="$BASE"; [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] || base=HEAD~1
            if git diff --name-only "$base" HEAD 2>/dev/null | grep -Eq '^(server/|src/net/|src/ui/online/|src/app/rumbleOnline|src/app/rumbleEntryInput|e2e/rumble-online\.spec\.ts|e2e/onlineDiag\.ts|scripts/online-e2e\.mjs)'; then run=true; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "online e2e: $run"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
        working-directory: server
      - if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/playwright-browser
      - if: steps.scope.outputs.run == 'true'
        name: Runner
        run: |
          echo "$(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p'), $(free -g | awk '/Mem:/ {print $2}') GB"
      - if: steps.scope.outputs.run == 'true'
        name: Two browsers, one server (light profile, pinned, server load asserted)
        env:
          ONLINE_E2E_PROFILE: light
          ONLINE_E2E_PIN: '1'
          ONLINE_E2E_ASSERT_SERVER: '1'
          ONLINE_E2E_DIAG_DIR: online-e2e-diag
        run: node scripts/online-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: online-e2e-diagnostics
          path: online-e2e-diag
          if-no-files-found: ignore
          retention-days: 14

  # The one required check: green only when every mandatory job passed (or the suite was legitimately
  # skipped for a documentation-only commit). scripts/ci/plan.ts trusts only commits where this passed.
  gate:
    name: CI gate
    needs: [plan, quality, unit, server, build, browser, e2e, e2e-report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory check
        env:
          FULL: ${{ needs.plan.outputs.full }}
          PLAN: ${{ needs.plan.result }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          SERVER: ${{ needs.server.result }}
          BUILD: ${{ needs.build.result }}
          BROWSER: ${{ needs.browser.result }}
          E2E: ${{ needs.e2e.result }}
          REPORT: ${{ needs.e2e-report.result }}
        run: |
          echo "plan=$PLAN full=$FULL quality=$QUALITY unit=$UNIT server=$SERVER build=$BUILD browser=$BROWSER e2e=$E2E report=$REPORT"
          ok=true
          for r in "$PLAN" "$QUALITY" "$UNIT" "$SERVER" "$BUILD"; do [ "$r" = success ] || ok=false; done
          if [ "$FULL" = true ]; then
            [ "$BROWSER" = success ] && [ "$E2E" = success ] && [ "$REPORT" = success ] || ok=false
          elif [ "$FULL" != false ]; then
            ok=false
          fi
          if [ "$ok" != true ]; then echo "::error::A mandatory check did not pass"; exit 1; fi
      - uses: actions/checkout@v4
        if: always()
      - name: Timings
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/report.ts timings

  # The GitHub Pages preview is the build of claude/wahala-stitch-uiux-v1 (deploy.yml holds the branch and
  # the release checks). On any other branch the release checks run as a dry run and nothing is published.
  deploy-preview:
    name: Deploy preview
    needs: [plan, gate]
    if: needs.gate.result == 'success' && needs.plan.outputs.full == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy.yml
