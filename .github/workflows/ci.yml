name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# a newer push supersedes an older run on the same branch (the e2e suite takes over an hour here)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        timeout-minutes: 120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # The GitHub Pages preview is the build of the branch the founder is testing (since the Stitch menu:
  # claude/wahala-stitch-uiux-v1; before it claude/wahala-gameplay-rumble-v2); it is published only after
  # everything above passed on this exact commit.
  deploy-preview:
    needs: check
    if: github.event_name == 'push' && github.ref_name == 'claude/wahala-stitch-uiux-v1'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
