name: CI

# Release path (docs/CI.md):
#   plan + fast checks (typecheck/lint, unit tests, one production build) -> E2E shards in parallel, each on
#   its own runner serving that same build -> merged report (every listed test ran exactly once) -> CI gate
#   -> deploy (only the publishing branch, only this commit, only after the gate).
# A commit whose only changes since the last verified commit are documentation runs the fast checks and
# skips the browser suite and the deploy (scripts/ci/plan.ts).
on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]
  workflow_dispatch:
    inputs:
      shards:
        description: Number of E2E shards (separate runners)
        type: choice
        options: ['4', '6', '8']
        default: '8'
      workers:
        description: Playwright workers per shard
        type: choice
        options: ['1', '2']
        default: '1'

# a newer push supersedes an older run on the same branch; a cancelled run never deploys
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  E2E_SHARDS: '8'
  E2E_WORKERS: '1'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      shards: ${{ steps.matrix.outputs.shards }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      workers: ${{ steps.matrix.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node --experimental-strip-types scripts/ci/plan.ts
      - id: matrix
        env:
          SHARDS: ${{ inputs.shards || env.E2E_SHARDS }}
          WORKERS: ${{ inputs.workers || env.E2E_WORKERS }}
        run: |
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"
          echo "matrix=$(seq -s, 1 "$SHARDS" | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"
      # duration-balanced shards: every listed test in exactly one shard (scripts/ci/shards.ts)
      - if: steps.plan.outputs.full == 'true'
        run: npm ci
      - if: steps.plan.outputs.full == 'true'
        name: Per-test durations of the last fully passing suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-timings&per_page=10" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' || true)
          if [ -n "$run" ] && gh run download "$run" -n e2e-timings -D timings -R "$GITHUB_REPOSITORY"; then
            echo "durations from run $run"
          else
            echo "no recorded durations: every test counts the same"
          fi
      - if: steps.plan.outputs.full == 'true'
        name: Split the suite into shards
        run: |
          npx playwright test --list --reporter=json > listed.json
          timings=timings/e2e-timings.json; [ -f "$timings" ] || timings=-
          node --experimental-strip-types scripts/ci/shards.ts split listed.json "$timings" "${{ steps.matrix.outputs.shards }}" shard-lists
      - if: steps.plan.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shard-lists
          path: shard-lists
          if-no-files-found: error
          retention-days: 7

  # installs the browser and its system packages once and caches them for the shards (runs beside the checks)
  browser:
    name: Browser cache
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browser
        with:
          save: 'true'

  quality:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc --noEmit && vite build`; the type check is the quality job's
      - run: npx vite build
      # every E2E shard and the deploy use exactly this build of this commit
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  e2e:
    name: E2E shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}
    needs: [plan, quality, unit, build, browser]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      WAHALA_E2E_PREBUILT: '1'
      WAHALA_E2E_WORKERS: ${{ needs.plan.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: shard-lists
          path: shard-lists
      # the tests run headless, which is the headless shell; the full browser is not needed
      - uses: ./.github/actions/playwright-browser
      # software WebGL speed follows the runner's CPU, which varies between runs: keep it in the log
      - name: Runner
        run: |
          echo "$(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p'), $(free -g | awk '/Mem:/ {print $2}') GB"
      # this shard's tests from the plan; --fully-parallel lets a shard's workers share a file (every test
      # has its own browser context; no spec shares state between tests)
      - run: npx playwright test --test-list shard-lists/shard-${{ matrix.shard }}.txt --fully-parallel
        timeout-minutes: 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 14

  e2e-report:
    name: E2E report
    needs: [plan, e2e]
    if: ${{ !cancelled() && needs.plan.outputs.full == 'true' && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge the shard reports (HTML with traces and screenshots, JSON)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Every listed test ran exactly once; totals, flaky tests
        run: |
          npx playwright test --list --reporter=json > listed.json
          node --experimental-strip-types scripts/ci/report.ts tests listed.json merged.json
      # per-test durations of this fully passing suite: the next run's shard plan
      - run: node --experimental-strip-types scripts/ci/shards.ts timings merged.json e2e-timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-timings
          path: e2e-timings.json
          retention-days: 30
      - name: Timings
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/report.ts timings

  # The one required check: green only when every mandatory job passed (or the suite was legitimately
  # skipped for a documentation-only commit). scripts/ci/plan.ts trusts only commits where this passed.
  gate:
    name: CI gate
    needs: [plan, quality, unit, build, browser, e2e, e2e-report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory check
        env:
          FULL: ${{ needs.plan.outputs.full }}
          PLAN: ${{ needs.plan.result }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          BROWSER: ${{ needs.browser.result }}
          E2E: ${{ needs.e2e.result }}
          REPORT: ${{ needs.e2e-report.result }}
        run: |
          echo "plan=$PLAN full=$FULL quality=$QUALITY unit=$UNIT build=$BUILD browser=$BROWSER e2e=$E2E report=$REPORT"
          ok=true
          for r in "$PLAN" "$QUALITY" "$UNIT" "$BUILD"; do [ "$r" = success ] || ok=false; done
          if [ "$FULL" = true ]; then
            [ "$BROWSER" = success ] && [ "$E2E" = success ] && [ "$REPORT" = success ] || ok=false
          elif [ "$FULL" != false ]; then
            ok=false
          fi
          if [ "$ok" != true ]; then echo "::error::A mandatory check did not pass"; exit 1; fi
      - uses: actions/checkout@v4
        if: always()
      - name: Timings
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/report.ts timings

  # The GitHub Pages preview is the build of claude/wahala-stitch-uiux-v1 (deploy.yml holds the branch and
  # the release checks). On any other branch the release checks run as a dry run and nothing is published.
  deploy-preview:
    name: Deploy preview
    needs: [plan, gate]
    if: needs.gate.result == 'success' && needs.plan.outputs.full == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy.yml
