name: Deploy preview to GitHub Pages

# The playable mobile preview at https://tundelaniyan.github.io/wahala-game/ is built from the
# nine-arenas / City Rumble branch. Only this workflow (on this branch) deploys; `main` keeps its own
# copy of the old workflow, so a push to `main` would replace the preview (see docs/DEPLOYMENT.md).
on:
  push:
    branches: [claude/wahala-nine-arenas-city-rumble]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # SPA fallback and no Jekyll processing (files starting with "_" must be served).
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
