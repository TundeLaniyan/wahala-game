# Production-SHAPED stack (nginx TLS edge in front of the game server). Used for local validation with a self-signed
# certificate and, later, on the approved VM with a real certificate. Nothing here provisions anything by itself.
#   ops/scripts/gen-dev-cert.sh                       # local only: self-signed cert into ops/edge/certs (git-ignored)
#   docker compose -f ops/compose/compose.edge.yml --env-file ops/env/server.local.env up --build
# The game server is NOT published to the host: only the edge is. /metrics is reachable only on the private network
# (`docker compose exec`) or by a monitor container on the `internal` network.
services:
  rumble:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile
    image: wahala-rumble-server:local
    init: true
    restart: unless-stopped
    env_file: ../env/server.local.env
    expose: ['2567']
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 10s
    logging: # server logs hold PRIVATE ROOM CODES ("room ABC123 created"): small, rotated, never shipped off the box by default
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  edge:
    image: ${EDGE_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    depends_on:
      rumble: { condition: service_healthy }
    ports:
      - '${EDGE_HTTPS_PORT:-8443}:8443'
      - '${EDGE_HTTP_PORT:-8080}:8080'
    volumes:
      - ../edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../edge/certs:/etc/edge/certs:ro
      - ../edge/allow.conf:/etc/edge/allow.conf:ro
    networks: [internal, public]
    read_only: true
    tmpfs: ['/tmp', '/var/cache/nginx']
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID] # only so the nginx master can start its unprivileged workers
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
networks:
  # Fixed subnet so RUMBLE_TRUSTED_PROXIES (ops/env/server.env.example) can name the nginx container's range.
  internal:
    internal: false
    ipam:
      config: [{ subnet: 172.29.0.0/24 }]
  public: {}
