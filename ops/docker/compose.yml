# Single-host stack: the game server on a PRIVATE network + an nginx edge that terminates TLS. Needs no cloud service.
# Local TLS rehearsal (self-signed, localhost):
#   ops/proxy/make-selfsigned.sh localhost ops/proxy/certs
#   (cd server && npm run bundle)
#   docker compose --env-file ops/env/compose.local.env -f ops/docker/compose.yml up --build
# Real host later: same file, PUBLIC_HOST=<your domain>, TLS_CERT_DIR=/etc/letsencrypt/live/<domain> (docs/ops/04).
name: wahala-rumble
services:
  rumble:
    build:
      context: ../../server
      dockerfile: ../ops/docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: wahala-rumble-server:ops
    init: true                      # real PID 1: reaps zombies, forwards SIGTERM
    restart: unless-stopped
    environment:
      PORT: "2567"
      RUMBLE_ALLOWED_ORIGINS: ${RUMBLE_ALLOWED_ORIGINS:?set RUMBLE_ALLOWED_ORIGINS (e.g. https://tundelaniyan.github.io)}
      RUMBLE_METRICS_TOKEN: ${RUMBLE_METRICS_TOKEN:?set RUMBLE_METRICS_TOKEN (openssl rand -hex 24)}
      RUMBLE_RECONNECT_SECONDS: ${RUMBLE_RECONNECT_SECONDS:-30}
    # not published on the host: only the proxy can reach it
    expose: ["2567"]
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${RUMBLE_MEM_LIMIT:-1g}
    cpus: ${RUMBLE_CPUS:-1.0}       # one process = one busy thread; give it one core, run one container per core
    stop_grace_period: 20s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      rumble: { condition: service_healthy }
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      UPSTREAM: rumble:2567
      TLS_CERT: /tls/fullchain.pem
      TLS_KEY: /tls/privkey.pem
      CREATE_RATE_PER_MIN: ${CREATE_RATE_PER_MIN:-12}
      NGINX_ENVSUBST_FILTER: "^(PUBLIC_HOST|UPSTREAM|TLS_CERT|TLS_KEY|CREATE_RATE_PER_MIN)$"
    volumes:
      - ../proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-../proxy/certs}:/tls:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [internal, edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
networks:
  internal: { internal: true }     # no route to the internet from the game server
  edge: {}
