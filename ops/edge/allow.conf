# Optional IP allowlist for the FIRST private tests (included by nginx.conf in the https server block). Empty = open to all.
# Works for testers on a known Wi-Fi/office IP; it is FRAGILE for phones on mobile data (carrier NAT, changing addresses).
# To restrict:  list every allowed address, then end with `deny all;`
#   allow 203.0.113.10;
#   allow 198.51.100.0/24;
#   deny all;
