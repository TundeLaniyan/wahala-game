# WAHALA! PRIVATE-BETA edge: the proven City Rumble edge (ops/edge/nginx.conf, unchanged rules) PLUS the player platform API.
# Derived from nginx.conf; the differences are marked `BETA:`. TLS termination + WebSocket proxy + per-IP abuse limits.
# The game server speaks plain ws/http on one port and has NO per-IP limits of its own (docs/ops/AUDIT.md F2, F3).
# This file is what stands between the internet and it. Mount it read-only at /etc/nginx/nginx.conf.
#
# Reading guide
#   /matchmake/*   room create / join (HTTP). Rate-limited per client IP: this is the room-creation flood vector.
#   /<pid>/<room>  the WebSocket upgrade. Capped per client IP by concurrent connections.
#   /health        proxied (uptime monitors). /metrics is NEVER served publicly: 404 here, reachable on the private network.
#
# CGNAT WARNING: Nigerian mobile carriers (and home routers) put many phones behind one public IP. Per-IP numbers must stay
# generous or a whole neighbourhood is locked out by one flood. The values below are a starting point to be tuned from the
# real logs of the first supervised test, not a result (docs/ops/SECURITY_CHECKLIST.md).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
  # ---- privacy of logs: the URL of a private room is its code, and the websocket query holds a seat reservation id.
  # Log only the route CLASS, never the path or query.
  map $uri $route_class {
    ~^/matchmake/  matchmake;
    ~^/v1/         platform_api;   # BETA: the path holds ids (/v1/parties/<uuid>): class only
    /health        health;
    /metrics       metrics;
    default        ws_or_other;
  }
  # Neither the User-Agent nor the Referer is logged either.
  log_format ops '$time_iso8601 $remote_addr "$request_method $route_class" $status $request_time '
                 'up=$upstream_response_time bytes=$bytes_sent';
  access_log /dev/stdout ops;

  server_tokens off;
  client_max_body_size 64k;          # BETA: platform bodies are small JSON (match results are the server's signed internal call, not routed here)
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 30s;

  # BETA: containers are recreated (a crash, a release, a restart) and get a NEW address. nginx must look the names up again at request
  # time through Docker's resolver instead of keeping the address it saw at start-up: a variable in proxy_pass does exactly that.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # per-IP state: 10 MB holds ~160k addresses per zone
  limit_req_zone  $binary_remote_addr zone=mmcreate:10m  rate=6r/m;    # ROOM CREATION: a started room costs ~35% of a core (AUDIT.md F3)
  limit_req_zone  $binary_remote_addr zone=matchmake:10m rate=60r/m;   # joins / quick play: 1/s per IP (a player uses 1-3 per match)
  limit_req_zone  $binary_remote_addr zone=other:10m      rate=10r/s;
  limit_req_zone  $binary_remote_addr zone=api:10m        rate=20r/s;   # BETA: platform API, per IP (the platform has its own per-player limits too)
  limit_req_zone  $binary_remote_addr zone=guest:10m      rate=20r/m;   # BETA: anonymous account creation, per IP (CGNAT: generous; the platform adds 5 burst / 6 per minute)
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  server {
    listen 8080;
    server_name _;
    location = /health { access_log off; default_type application/json; return 200 '{"ok":true,"edge":true}'; }
    # BETA: Let's Encrypt HTTP-01 challenges are answered from a folder the certificate tool writes (ops/beta/wahala-beta.sh cert)
    location /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 308 https://$host$request_uri; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/edge/certs/fullchain.pem;
    ssl_certificate_key /etc/edge/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # never public
    location = /metrics { return 404; }
    location /debug     { return 404; }

    # uptime monitors / the latency page
    location = /health {
      limit_req zone=other burst=20 nodelay;
      set $rumble_up rumble:2567;
      proxy_pass http://$rumble_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # BETA: never public, whatever the services answer. Operators reach them from the server itself (wahala-beta.sh admin / status).
    location /internal/ { return 404; }
    location /admin/    { return 404; }
    location = /ready   { return 404; }

    # BETA: the player platform. Its own liveness for external uptime monitors; the API; the public keys that verify match tickets.
    location = /platform-health {
      limit_req zone=other burst=20 nodelay;
      set $platform_up platform:4567;
      proxy_pass http://$platform_up/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
    location = /.well-known/jwks.json {
      limit_req zone=api burst=20 nodelay;
      set $platform_up platform:4567;
      proxy_pass http://$platform_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    # creating a guest account: the abuse surface of a guest-first system (the platform limits it again per address)
    location = /v1/auth/guest {
      limit_req zone=guest burst=10 nodelay;
      set $platform_up platform:4567;
      proxy_pass http://$platform_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: a client-supplied value is not trusted
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 15s;
    }
    location /v1/ {
      limit_req zone=api burst=60 nodelay;
      limit_conn perip 64;
      set $platform_up platform:4567;
      proxy_pass http://$platform_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 20s;
    }

    # optional allowlist for the first private tests (empty file = everyone); see docs/ops/SECURITY_CHECKLIST.md
    include /etc/edge/allow.conf;

    # creating a room: strict. Only a host does this, once per match. (Quick play, /matchmake/joinOrCreate, is the lenient zone
    # below: a whole NAT'd group may press it together, and joining an existing waiting room creates nothing.)
    # 2 000 rooms / 1.9 s from one IP with no limit: docs/ops/AUDIT.md F2.
    location /matchmake/create/ {
      limit_req zone=mmcreate burst=4 nodelay;
      limit_conn perip 64;
      set $rumble_up rumble:2567;
      proxy_pass http://$rumble_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 15s;
    }

    # room joining / quick play
    location /matchmake/ {
      limit_req zone=matchmake burst=30 nodelay;
      limit_conn perip 64;
      set $rumble_up rumble:2567;
      proxy_pass http://$rumble_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: a client-supplied value is not trusted
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 15s;
    }

    # everything else is the WebSocket upgrade (/<processId>/<roomId>?sessionId=...). Non-upgrade requests are refused.
    location / {
      if ($http_upgrade != "websocket") { return 426; }
      limit_conn perip 64;               # concurrent sockets per IP (a 32-player LAN party behind one NAT fits)
      limit_req zone=other burst=40 nodelay;
      set $rumble_up rumble:2567;
      proxy_pass http://$rumble_up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 120s;           # the server pings every 3 s; a silent socket this long is dead
      proxy_send_timeout 120s;
    }
  }
}
