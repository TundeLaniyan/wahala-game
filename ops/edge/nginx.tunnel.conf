# WAHALA! founder-laptop TUNNEL edge (docs/ops/BETA_TUNNEL_TESTING.md). The ONE entry point behind a Cloudflare Quick Tunnel:
#
#   tester -- https/wss --> Cloudflare --> cloudflared (on this laptop) --http--> THIS edge (127.0.0.1 only)
#                                                                        |-- the beta game page (static files)
#                                                                        |-- /v1/*       the player platform
#                                                                        \-- /matchmake/* and the WebSocket upgrade: the match server
#
# Derived from nginx.beta.conf (same limits, same never-public routes). Differences, marked `TUNNEL:`
#   * plain HTTP on the inside: Cloudflare terminates TLS; this port is published on 127.0.0.1 ONLY (ops/beta/compose.tunnel.yml);
#   * it serves the game page too, so page, API and WebSocket share ONE origin (no CORS, no mixed content, one tunnel);
#   * a per-run HOST check (only the tunnel's own address is served) and a per-tester ACCESS GATE (a cookie that a private link sets)
#     stand in front of everything: a visitor without a link gets a plain 403 and reaches neither the page, the API nor the sockets.
#     The gate does not replace the WAHALA! invite code (the platform still refuses accounts without one) nor the match server's
#     ticket requirement: it is the first of three locks, not the only one;
#   * the visitor's real address comes from Cloudflare's CF-Connecting-IP, so the per-IP limits count visitors, not the tunnel.
#
# The two generated files in /etc/edge/tunnel/ (written by scripts/beta-tunnel.mjs, never committed):
#   host.conf  `map $host $host_ok`        1 only for the tunnel's address of this run
#   gate.conf  `map $cookie_wahala_gate $gate_ok` and `map $arg_k $enter_ok`   1 only for a tester's private token
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ---- privacy of logs: only the route CLASS (a private room's code is a path, a seat reservation is a query); no User-Agent, no Referer.
  # TUNNEL: the access token travels in a query on /__enter only, and the route class hides it as well.
  map $uri $route_class {
    ~^/matchmake/  matchmake;
    ~^/v1/         platform_api;
    /health        health;
    /__enter       enter;
    /metrics       metrics;
    ~^/assets/     static;
    default        page_or_ws;
  }
  log_format ops '$time_iso8601 $remote_addr "$request_method $route_class" $status $request_time up=$upstream_response_time bytes=$bytes_sent';
  access_log /dev/stdout ops;

  server_tokens off;
  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 60s;
  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

  # TUNNEL: the visitor's address. cloudflared reaches this edge from the Docker host's own address (a private range, whatever the
  # operating system), and Cloudflare sets CF-Connecting-IP itself, replacing any value a visitor sends. A header from anywhere else
  # (a request that did not come through the host's loopback) is ignored.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;

  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  include /etc/edge/tunnel/host.conf;
  include /etc/edge/tunnel/gate.conf;

  # per-visitor state (the same values as the server edge: nginx.beta.conf; CGNAT note there)
  limit_req_zone  $binary_remote_addr zone=mmcreate:10m  rate=6r/m;
  limit_req_zone  $binary_remote_addr zone=matchmake:10m rate=60r/m;
  limit_req_zone  $binary_remote_addr zone=other:10m      rate=10r/s;
  limit_req_zone  $binary_remote_addr zone=api:10m        rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=guest:10m      rate=20r/m;
  limit_req_zone  $binary_remote_addr zone=enter:10m      rate=10r/m;   # TUNNEL: the private link; a token is 128 random bits, this only stops noise
  limit_req_zone  $binary_remote_addr zone=denied:10m     rate=30r/m;   # TUNNEL: strangers: cheap refusals, bounded
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # redirects are RELATIVE: the hop from cloudflared to here is plain http, and an absolute Location would send the visitor to http://
    absolute_redirect off;

    # ---- the two locks in front of everything ------------------------------------------------------------------------------
    # lock 1, the HOST: only this run's tunnel address is served (not a bare IP, not another name pointed at the tunnel).
    # lock 2, the GATE: the cookie a tester's private link sets. Exemptions: /__enter (it needs a valid token of its own) and /health
    # (the location itself answers only a LOCAL Host: the container health check and the launcher; the tunnel's host gets a 404).
    set $host_block 0;
    set $gate_block 0;
    if ($host_ok = 0)  { set $host_block 1; }
    if ($gate_ok = 0)  { set $gate_block 1; }
    if ($uri = /__enter) { set $gate_block 0; }
    if ($uri = /health)  { set $gate_block 0; set $host_block 0; }
    error_page 421 = @wrong_host;
    error_page 403 @no_access;      # no `=`: the status stays 403 while the page below is served
    error_page 429 = @limited;
    if ($host_block = 1) { return 421; }
    if ($gate_block = 1) { return 403; }

    location @wrong_host {
      internal;
      default_type text/plain;
      return 421 'wrong address';
    }
    # The refusal page is a FILE served through an internal redirect, not a `return`: a `return` runs before `limit_req` and would make every
    # refusal free. Here the limiter really runs, so a stranger who keeps knocking (or guesses links) is answered 429.
    location @no_access {
      internal;
      limit_req zone=denied burst=10 nodelay;
      # only a GET can be answered with a file (a static file answers a POST with 405); every other method gets the plain refusal
      if ($request_method !~ ^(GET|HEAD)$) { return 403 'forbidden'; }
      root /etc/edge/denied;
      rewrite ^ /tunnel-denied.html break;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
    }
    location @limited {
      internal;
      default_type application/json;
      add_header Retry-After 10 always;
      add_header X-Content-Type-Options nosniff always;
      return 429 '{"error":{"code":"rate_limited","message":"too many requests"}}';
    }

    # ---- never public, whatever the services answer (as in nginx.beta.conf) ---------------------------------------------------------
    location = /metrics { return 404; }
    location /debug     { return 404; }
    location /internal/ { return 404; }
    location /admin/    { return 404; }
    location = /ready   { return 404; }

    # edge liveness, for the container health check and the launcher. LOCAL Host only.
    location = /health {
      access_log off;
      if ($host !~ ^(127\.0\.0\.1|localhost)$) { return 404; }
      default_type application/json;
      return 200 '{"ok":true,"edge":true}';
    }

    # the tester's private link: /__enter?k=<token> sets the gate cookie, then goes to the game. The token is removed from the address bar.
    location = /__enter {
      limit_req zone=enter burst=6 nodelay;
      if ($enter_ok = 0) { return 403; }
      add_header Set-Cookie "wahala_gate=$arg_k; Path=/; Max-Age=43200; Secure; HttpOnly; SameSite=Lax" always;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      return 302 /;
    }

    # ---- the player platform ---------------------------------------------------------------------------------------------------------
    location = /platform-health {
      limit_req zone=other burst=20 nodelay;
      set $platform_up platform:4567;
      proxy_pass http://$platform_up/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
    location = /.well-known/jwks.json {
      limit_req zone=api burst=20 nodelay;
      set $platform_up platform:4567;
      proxy_pass http://$platform_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /v1/auth/guest {
      limit_req zone=guest burst=10 nodelay;
      set $platform_up platform:4567;
      proxy_pass http://$platform_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: a client-supplied value is not trusted
      proxy_set_header X-Forwarded-Proto https;         # TUNNEL: the visitor's side is https (Cloudflare), this hop is not
      proxy_read_timeout 15s;
    }
    location /v1/ {
      limit_req zone=api burst=60 nodelay;
      limit_conn perip 64;
      set $platform_up platform:4567;
      proxy_pass http://$platform_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 20s;
    }

    # ---- the match server: room creation (strict), joining / quick play, and the WebSocket upgrade --------------------------------------
    location /matchmake/create/ {
      limit_req zone=mmcreate burst=4 nodelay;
      limit_conn perip 64;
      set $rumble_up rumble:2567;
      proxy_pass http://$rumble_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 15s;
    }
    location /matchmake/ {
      limit_req zone=matchmake burst=30 nodelay;
      limit_conn perip 64;
      set $rumble_up rumble:2567;
      proxy_pass http://$rumble_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 15s;
    }
    location @ws {
      limit_conn perip 64;
      limit_req zone=other burst=40 nodelay;
      set $rumble_up rumble:2567;
      proxy_pass http://$rumble_up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # ---- the game page (the private-beta build, mounted read-only at /srv/game) ----------------------------------------------------------
    # A WebSocket upgrade (the same URL space as the page: /<processId>/<roomId>) goes to the match server; everything else is a file.
    location /assets/ {
      root /srv/game;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      try_files $uri =404;
    }
    location / {
      error_page 418 = @ws;
      if ($http_upgrade = websocket) { return 418; }
      root /srv/game;
      index index.html;
      add_header Cache-Control "no-cache" always;      # the page and the service worker: always re-checked (hashed assets are immutable)
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      try_files $uri $uri/ /index.html;
    }
  }
}
