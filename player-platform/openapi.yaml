openapi: 3.0.3
info:
  title: WAHALA! player platform API
  version: 0.1.0
  description: |
    Persistent identity, profiles, friends, parties, safety and commerce foundations around the City Rumble match server.
    DEVELOPMENT ONLY: not deployed, not public. Guests need no account. Authentication is `Authorization: Bearer wa_...` (an opaque
    access token from `/v1/auth/*`). Errors are always `{ "error": { "code", "message", "requestId", "retryAfterMs?" } }`.
    A route table test (`test/openapi.test.ts`) fails if this file and the server's routes ever disagree.
servers:
  - url: http://127.0.0.1:4567
components:
  securitySchemes:
    player:
      {
        type: http,
        scheme: bearer,
        description: 'Access token (wa_...). 15 minutes; rotate with /v1/auth/refresh.',
      }
    service:
      {
        type: apiKey,
        in: header,
        name: X-Wahala-Signature,
        description: 'HMAC-SHA256(secret, `${X-Wahala-Timestamp}.${METHOD}.${path}.${rawBody}`); timestamp within 5 minutes.',
      }
    admin: { type: http, scheme: bearer, description: 'PLATFORM_ADMIN_TOKEN (moderation). Off when unset.' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              {
                type: string,
                enum:
                  [
                    bad_request,
                    unauthenticated,
                    forbidden,
                    not_found,
                    conflict,
                    name_taken,
                    name_rejected,
                    rate_limited,
                    reauth_required,
                    provider_not_configured,
                    provider_rejected,
                    payload_too_large,
                    restricted_account,
                    unavailable,
                    internal,
                  ],
              }
            message: { type: string }
            requestId: { type: string, format: uuid }
            retryAfterMs: { type: integer }
    Tokens:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        accessToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshExpiresAt: { type: string, format: date-time }
    Capabilities:
      type: object
      properties:
        {
          textChat: { type: boolean },
          voice: { type: boolean },
          purchases: { type: boolean },
          friendCodeOnly: { type: boolean },
        }
    MyProfile:
      type: object
      properties:
        id: { type: string, format: uuid, description: Immutable player id. }
        displayName: { type: string }
        kind: { type: string, enum: [guest, registered] }
        friendCode: { type: string }
        ageGroup: { type: string, enum: [unspecified, under_13, 13_17, adult] }
        selectedCharacter: { type: string }
        loadout: { type: object, additionalProperties: { type: string } }
        presenceVisibility: { type: string, enum: [friends, nobody] }
        settings: { type: object }
        createdAt: { type: string, format: date-time }
        links:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    provider: { type: string, enum: [google, apple, mock] },
                    emailHint: { type: string, nullable: true },
                    linkedAt: { type: string, format: date-time },
                  },
              },
          }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
    ProviderCredential:
      type: object
      required: [provider, credential]
      properties:
        provider: { type: string, enum: [google, apple, mock] }
        credential:
          {
            type: string,
            description: 'OpenID Connect id token obtained by the client; carries the nonce from /v1/auth/nonce.',
          }
  responses:
    Err:
      {
        description: Error,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
paths:
  /v1/auth/guest:
    post:
      summary: Create a guest account (no credentials needed) and its first session
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        {
                          nickname: { type: string },
                          platform: { type: string, enum: [web, android, ios, dev] },
                          deviceLabel: { type: string },
                          ageGroup: { type: string, enum: [unspecified, under_13, 13_17, adult] },
                        },
                    },
                },
            },
        }
      responses: { '201': { description: Created }, default: { $ref: '#/components/responses/Err' } }
  /v1/auth/providers:
    get:
      summary: Which sign-in providers this server can verify right now
      responses: { '200': { description: OK } }
  /v1/auth/nonce:
    post:
      summary: Single-use nonce to pass to the provider sign-in
      responses: { '201': { description: Created } }
  /v1/auth/signin:
    post:
      summary: Sign in (or register) with a provider id token verified by the server
      requestBody:
        { content: { application/json: { schema: { $ref: '#/components/schemas/ProviderCredential' } } } }
      responses:
        {
          '200': { description: Existing account },
          '201': { description: New registered account },
          default: { $ref: '#/components/responses/Err' },
        }
  /v1/auth/refresh:
    post:
      summary: Rotate the refresh token and get a new access token
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [refreshToken],
                      properties: { refreshToken: { type: string } },
                    },
                },
            },
        }
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Err' } }
  /v1/auth/logout:
    post:
      security: [{ player: [] }]
      summary: Revoke the current session
      responses: { '204': { description: Revoked } }
  /v1/auth/upgrade:
    post:
      security: [{ player: [] }]
      summary: Turn the guest account into a registered one (same player id and profile)
      requestBody:
        { content: { application/json: { schema: { $ref: '#/components/schemas/ProviderCredential' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Err' } }
  /v1/auth/reauth:
    post:
      security: [{ player: [] }]
      summary: Prove the account owner is present (needed for unlink, delete, age changes)
      requestBody:
        { content: { application/json: { schema: { $ref: '#/components/schemas/ProviderCredential' } } } }
      responses: { '204': { description: OK } }
  /v1/auth/links:
    post:
      security: [{ player: [] }]
      summary: Link another sign-in provider to the account
      requestBody:
        { content: { application/json: { schema: { $ref: '#/components/schemas/ProviderCredential' } } } }
      responses: { '201': { description: Linked } }
  /v1/auth/links/{provider}:
    delete:
      security: [{ player: [] }]
      summary: Unlink a sign-in provider (never the last one)
      parameters:
        [{ name: provider, in: path, required: true, schema: { type: string, enum: [google, apple, mock] } }]
      responses: { '200': { description: OK } }
  /v1/auth/sessions:
    get:
      security: [{ player: [] }]
      summary: List the account’s active sessions (devices)
      responses: { '200': { description: OK } }
  /v1/auth/sessions/revoke-others:
    post:
      security: [{ player: [] }]
      summary: Sign out every other device
      responses: { '200': { description: OK } }
  /v1/auth/sessions/{id}:
    delete:
      security: [{ player: [] }]
      summary: Revoke one of your sessions
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Revoked } }
  /v1/me:
    get:
      security: [{ player: [] }]
      summary: Your profile, linked sign-ins and capabilities
      responses: { '200': { description: OK } }
    patch:
      security: [{ player: [] }]
      summary: Edit your profile (nickname, fighter, age band, presence visibility, settings, loadout)
      responses: { '200': { description: OK } }
  /v1/me/delete:
    post:
      security: [{ player: [] }]
      summary: 'Delete the account and erase personal data (body: { confirm: "DELETE" })'
      responses: { '204': { description: Deleted } }
  /v1/me/friend-code/rotate:
    post:
      security: [{ player: [] }]
      summary: Replace your friend code (the old one stops working)
      responses: { '200': { description: OK } }
  /v1/dev/mock-idp/token:
    post:
      summary: 'DEVELOPMENT ONLY: mint a signed test id token (not OAuth; absent unless PLATFORM_MOCK_IDP=1)'
      responses: { '200': { description: OK } }

  /v1/friends:
    get:
      security: [{ player: [] }]
      summary: Your friends with presence (as each of them allows it to be seen)
      responses:
        {
          '200':
            {
              description: '{ friends: [{ playerId, displayName, selectedCharacter, presence: online|away|in_match|offline, since }] }',
            },
        }
  /v1/friends/requests:
    get:
      security: [{ player: [] }]
      summary: Pending friend requests, incoming and outgoing
      responses: { '200': { description: '{ incoming: [...], outgoing: [...] }' } }
    post:
      security: [{ player: [] }]
      summary: Send a friend request by friend code
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [code],
                      properties: { code: { type: string, description: '8-character friend code' } },
                    },
                },
            },
        }
      responses:
        {
          '200': { description: 'Accepted at once (they had asked you)' },
          '201': { description: Pending },
          '404': { $ref: '#/components/responses/Err' },
          '409': { $ref: '#/components/responses/Err' },
        }
  /v1/friends/requests/{id}/accept:
    post:
      security: [{ player: [] }]
      summary: Accept a friend request
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /v1/friends/requests/{id}/decline:
    post:
      security: [{ player: [] }]
      summary: Decline a friend request
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Declined } }
  /v1/friends/requests/{id}:
    delete:
      security: [{ player: [] }]
      summary: Cancel a friend request you sent
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Cancelled } }
  /v1/friends/{playerId}:
    delete:
      security: [{ player: [] }]
      summary: Remove a friend
      parameters: [{ name: playerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Removed } }
  /v1/blocks:
    get:
      security: [{ player: [] }]
      summary: Players you blocked
      responses: { '200': { description: OK } }
  /v1/blocks/{playerId}:
    put:
      security: [{ player: [] }]
      summary: Block a player (unfriends, cancels requests and invitations, separates a shared party)
      parameters: [{ name: playerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Blocked } }
    delete:
      security: [{ player: [] }]
      summary: Unblock a player
      parameters: [{ name: playerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Unblocked } }
  /v1/presence:
    put:
      security: [{ player: [] }]
      summary: 'Heartbeat: say you are online or away (call every ~30 s; expires after 90 s)'
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [status],
                      properties: { status: { type: string, enum: [online, away] } },
                    },
                },
            },
        }
      responses: { '204': { description: OK } }
  /v1/me/matches:
    get:
      security: [{ player: [] }]
      summary: Your recent non-ranked match history (written only by the match server)
      responses:
        {
          '200':
            {
              description: '{ matches: [{ matchId, game, arenaId, endedAt, durationSec, humans, you: { placement, kills, deaths, assists, botKills, botDeaths, botAssists, controlledByBotAtEnd, team } }] }',
            },
        }
  /v1/parties:
    post:
      security: [{ player: [] }]
      summary: Create a private party (you lead it)
      requestBody:
        {
          content:
            {
              application/json:
                { schema: { type: object, properties: { mode: { type: string, enum: [ffa, team] } } } },
            },
        }
      responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Err' } }
  /v1/parties/current:
    get:
      security: [{ player: [] }]
      summary: The party you are in, or null
      responses: { '200': { description: '{ party: PartyView | null }' } }
  /v1/parties/join:
    post:
      security: [{ player: [] }]
      summary: Join a party by its shareable code
      requestBody:
        {
          content:
            {
              application/json:
                { schema: { type: object, required: [code], properties: { code: { type: string } } } },
            },
        }
      responses:
        {
          '200': { description: Joined },
          '404':
            { description: 'Not available (wrong, full, closed, expired, or blocked: one answer for all)' },
        }
  /v1/parties/{id}:
    get:
      security: [{ player: [] }]
      summary: A party you are a member of
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
    patch:
      security: [{ player: [] }]
      summary: 'Leader: change the party mode (free-for-all or team)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [mode],
                      properties: { mode: { type: string, enum: [ffa, team] } },
                    },
                },
            },
        }
      responses: { '200': { description: OK } }
  /v1/parties/{id}/leave:
    post:
      security: [{ player: [] }]
      summary: Leave the party (the leader leaving promotes the longest-standing member)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Left } }
  /v1/parties/{id}/ready:
    post:
      security: [{ player: [] }]
      summary: Set your ready flag
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                { schema: { type: object, required: [ready], properties: { ready: { type: boolean } } } },
            },
        }
      responses: { '200': { description: OK } }
  /v1/parties/{id}/kick:
    post:
      security: [{ player: [] }]
      summary: 'Leader: remove a member'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [playerId],
                      properties: { playerId: { type: string, format: uuid } },
                    },
                },
            },
        }
      responses: { '200': { description: OK } }
  /v1/parties/{id}/promote:
    post:
      security: [{ player: [] }]
      summary: 'Leader: hand the leadership to another member'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [playerId],
                      properties: { playerId: { type: string, format: uuid } },
                    },
                },
            },
        }
      responses: { '200': { description: OK } }
  /v1/parties/{id}/code/rotate:
    post:
      security: [{ player: [] }]
      summary: 'Leader: replace the party code (the old one stops working)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /v1/parties/{id}/invites:
    post:
      security: [{ player: [] }]
      summary: 'Leader: invite a friend (expires after 10 minutes)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [friendId],
                      properties: { friendId: { type: string, format: uuid } },
                    },
                },
            },
        }
      responses: { '201': { description: Invited } }
  /v1/invites:
    get:
      security: [{ player: [] }]
      summary: Party invitations sent to you that are still valid
      responses: { '200': { description: OK } }
  /v1/invites/{id}/accept:
    post:
      security: [{ player: [] }]
      summary: Accept a party invitation
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /v1/invites/{id}/decline:
    post:
      security: [{ player: [] }]
      summary: Decline a party invitation
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Declined } }
  /v1/parties/{id}/match:
    post:
      security: [{ player: [] }]
      summary: 'Leader: report the match server room code the party will play in'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [roomCode],
                      properties:
                        {
                          roomCode:
                            {
                              type: string,
                              description: '6-character code of the private room the leader created on the match server',
                            },
                        },
                    },
                },
            },
        }
      responses: { '200': { description: OK } }
    delete:
      security: [{ player: [] }]
      summary: 'Leader: return the party to the lobby (room abandoned or match over)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /v1/parties/{id}/match/ticket:
    post:
      security: [{ player: [] }]
      summary: 'Member: get a signed two-minute ticket for the party’s room'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: '{ ticket (EdDSA JWT), roomCode, expiresAt, audience }' } }
  /.well-known/jwks.json:
    get:
      summary: Public keys the match server uses to verify tickets
      responses: { '200': { description: JWKS } }
  /internal/v1/matches/started:
    post:
      security: [{ service: [] }]
      summary: 'Match server: a match began (participants with their ticketed player ids)'
      description: 'Body: { matchId, game: survival|deathmatch|team, arenaId, roomCode?, seats, startedAt, participants: [{ seat, playerId?, name, isBot, team? }] }. Every non-null playerId must hold a ticket issued for roomCode.'
      responses:
        {
          '201': { description: Recorded },
          '200': { description: Duplicate },
          '400': { $ref: '#/components/responses/Err' },
          '401': { $ref: '#/components/responses/Err' },
        }
  /internal/v1/matches/finished:
    post:
      security: [{ service: [] }]
      summary: 'Match server: a match ended (final facts per seat). Idempotent: the first call wins'
      description: 'Body adds endedAt, durationSec and results: [{ seat, placement, kills, deaths, assists, botKills, botDeaths, botAssists, controlledByBotAtEnd }]. Facts only: no XP, rating or reward exists.'
      responses:
        {
          '201': { description: Recorded },
          '200': { description: Duplicate },
          '400': { $ref: '#/components/responses/Err' },
          '401': { $ref: '#/components/responses/Err' },
        }

  /v1/comms/signals:
    get:
      summary: The preset quick-chat, ping and emote catalogue (the only things players can send)
      responses: { '200': { description: '{ signals: [{ id, kind: chat|ping|emote, label, contexts }] }' } }
  /v1/parties/{id}/signals:
    post:
      security: [{ player: [] }]
      summary: Send a preset signal to your party
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [signalId],
                      properties: { signalId: { type: string, example: chat.ready } },
                    },
                },
            },
        }
      responses:
        {
          '201': { description: Sent },
          '403': { description: Restricted },
          '429': { $ref: '#/components/responses/Err' },
        }
    get:
      security: [{ player: [] }]
      summary: Party signals newer than `after` that you may see (blocked and muted senders are hidden)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        {
          '200':
            {
              description: '{ signals: [{ id, signalId, kind, label, from: { playerId, displayName }, at }] }',
            },
        }
  /v1/mutes:
    get:
      security: [{ player: [] }]
      summary: Players you muted
      responses: { '200': { description: OK } }
  /v1/mutes/{playerId}:
    put:
      security: [{ player: [] }]
      summary: Mute a player (you stop receiving their signals, text and voice; they are not told)
      parameters: [{ name: playerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Muted } }
    delete:
      security: [{ player: [] }]
      summary: Unmute a player
      parameters: [{ name: playerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Unmuted } }
  /v1/reports:
    post:
      security: [{ player: [] }]
      summary: Report a player you actually played or talked with
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [reportedId, category, context],
                      properties:
                        {
                          reportedId: { type: string, format: uuid },
                          category:
                            {
                              type: string,
                              enum:
                                [
                                  abusive_name,
                                  harassment,
                                  cheating,
                                  spam,
                                  inappropriate_content,
                                  impersonation,
                                  other,
                                ],
                            },
                          context: { type: string, enum: [profile, party, match, friend_request, chat] },
                          contextRef: { type: string, description: 'party id or match id' },
                          note: { type: string, maxLength: 200 },
                        },
                    },
                },
            },
        }
      responses:
        {
          '201': { description: Filed },
          '200': { description: 'Already reported (idempotent)' },
          '403': { description: 'No real interaction with that player' },
        }
  /v1/me/reports:
    get:
      security: [{ player: [] }]
      summary: The reports you filed and their status
      responses: { '200': { description: OK } }
  /v1/voice/status:
    get:
      security: [{ player: [] }]
      summary: Whether voice exists on this server and whether your account may use it (it does not exist yet)
      responses: { '200': { description: '{ available, eligible, reason }' } }
  /v1/voice/token:
    post:
      security: [{ player: [] }]
      summary: Ask for a voice room credential for your party (403 for minors; 503 until a media server exists)
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [partyId],
                      properties: { partyId: { type: string, format: uuid } },
                    },
                },
            },
        }
      responses:
        {
          '201': { description: Granted },
          '403': { $ref: '#/components/responses/Err' },
          '503': { $ref: '#/components/responses/Err' },
        }
  /internal/v1/comms/filter:
    post:
      security: [{ service: [] }]
      summary: 'Match server: which of these players may receive this sender’s signal / text / voice (blocks, mutes, restrictions, age)'
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [senderId, recipientIds, kind],
                      properties:
                        {
                          senderId: { type: string, format: uuid },
                          recipientIds: { type: array, maxItems: 64, items: { type: string, format: uuid } },
                          kind: { type: string, enum: [signal, text, voice] },
                        },
                    },
                },
            },
        }
      responses: { '200': { description: '{ senderAllowed, reason, recipients }' } }
  /admin/v1/reports:
    get:
      security: [{ admin: [] }]
      summary: 'Moderator: reports by status, with the target’s distinct-reporter count and each reporter’s dismissal history'
      parameters:
        - {
            name: status,
            in: query,
            required: false,
            schema: { type: string, enum: [open, actioned, dismissed], default: open },
          }
        - { name: limit, in: query, required: false, schema: { type: integer, maximum: 100 } }
      responses: { '200': { description: OK } }
  /admin/v1/reports/{id}/resolve:
    post:
      security: [{ admin: [] }]
      summary: 'Moderator: dismiss, warn, restrict signals for 24 h, or suspend the reported account'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [resolution, moderator],
                      properties:
                        {
                          resolution: { type: string, enum: [dismiss, warn, restrict_signals, suspend] },
                          moderator: { type: string, maxLength: 40 },
                        },
                    },
                },
            },
        }
      responses: { '204': { description: Resolved } }
  /admin/v1/players/{id}/restrictions/lift:
    post:
      security: [{ admin: [] }]
      summary: 'Moderator: lift every active communication restriction of a player'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /v1/dev/parties/{id}/chat:
    post:
      x-dev-only: true
      security: [{ player: [] }]
      summary: 'DEVELOPMENT ONLY: send a moderated text line to your party (adult registered accounts; absent unless PLATFORM_DEV_TEXT_CHAT=1)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: Sent } }
    get:
      x-dev-only: true
      security: [{ player: [] }]
      summary: 'DEVELOPMENT ONLY: read party text lines newer than `after`'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }

  /v1/shop/status:
    get:
      summary: Which payment providers are live (none in production today) and whether the sandbox is on
      responses: { '200': { description: '{ providers, purchasesEnabled, sandbox }' } }
  /v1/shop/catalog:
    get:
      security: [{ player: [] }]
      summary: The catalogue with your ownership; prices only where an operator has set them
      parameters:
        [
          {
            name: category,
            in: query,
            required: false,
            schema:
              {
                type: string,
                enum:
                  [outfit, generator_skin, emote, elimination_effect, banner, vehicle_cosmetic, narration],
              },
          },
        ]
      responses:
        {
          '200':
            {
              description: '{ items: [{ id, category, name, description, rarity, owned, forSale, prices: [{ currency, amountMinor, sandbox }] }] }',
            },
        }
  /v1/shop/entitlements:
    get:
      security: [{ player: [] }]
      summary: What you own beyond the defaults, plus the narration feature keys
      responses: { '200': { description: '{ items, features }' } }
  /v1/shop/orders:
    post:
      security: [{ player: [] }]
      summary: Start a purchase (header Idempotency-Key required). The PRICE is the server’s; adults on registered accounts only
      parameters:
        [
          {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 8, maxLength: 80 },
          },
        ]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [itemId, provider],
                      properties:
                        {
                          itemId: { type: string },
                          provider: { type: string, enum: [mock, web, apple, google] },
                        },
                    },
                },
            },
        }
      responses:
        {
          '201': { description: Created },
          '200':
            { description: 'Existing order returned (same key, or an order for that item is still open)' },
          '403': { $ref: '#/components/responses/Err' },
          '409': { $ref: '#/components/responses/Err' },
          '501': { description: 'Provider not configured' },
        }
    get:
      security: [{ player: [] }]
      summary: Your orders
      responses: { '200': { description: OK } }
  /v1/shop/orders/{id}:
    get:
      security: [{ player: [] }]
      summary: One of your orders
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /v1/shop/orders/{id}/cancel:
    post:
      security: [{ player: [] }]
      summary: Abandon an order that has not been paid
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Err' } }
  /v1/shop/orders/{id}/receipt:
    post:
      security: [{ player: [] }]
      summary: 'Store purchases: report the receipt; the server verifies it with the store (never believed)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                { schema: { type: object, required: [receipt], properties: { receipt: { type: string } } } },
            },
        }
      responses: { '200': { description: OK }, '501': { description: 'Provider not configured' } }
  /v1/shop/webhooks/{provider}:
    post:
      summary: A payment provider’s server-to-server notification (authenticated by the provider’s signature, not by a player)
      parameters:
        [
          {
            name: provider,
            in: path,
            required: true,
            schema: { type: string, enum: [mock, web, apple, google] },
          },
        ]
      responses:
        {
          '200': { description: '{ results: [{ eventId, outcome: applied|duplicate|ignored, ... }] }' },
          '401': { $ref: '#/components/responses/Err' },
          '501': { description: 'Provider not configured' },
        }
  /v1/dev/mock-checkout/{orderId}/complete:
    post:
      x-dev-only: true
      summary: 'DEVELOPMENT ONLY: play the payment provider’s server. Builds a SIGNED test event for an order and delivers it through the real webhook path (no money moves; absent unless PLATFORM_MOCK_CHECKOUT=1)'
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [outcome],
                      properties:
                        {
                          outcome:
                            { type: string, enum: [succeeded, failed, cancelled, refunded, chargeback] },
                          amountMinor: { type: integer },
                          currency: { type: string },
                          eventId: { type: string },
                        },
                    },
                },
            },
        }
      responses: { '200': { description: OK } }
  /admin/v1/orders:
    get:
      security: [{ admin: [] }]
      summary: 'Operator: orders by status'
      parameters: [{ name: status, in: query, required: false, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /admin/v1/orders/{id}/revoke:
    post:
      security: [{ admin: [] }]
      summary: 'Operator: revoke a purchased entitlement without a refund (fraud, abuse)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [reason, operator],
                      properties: { reason: { type: string }, operator: { type: string } },
                    },
                },
            },
        }
      responses: { '200': { description: OK } }
  /admin/v1/players/{id}/grants:
    post:
      security: [{ admin: [] }]
      summary: 'Operator: grant an item without a sale (promotion, compensation)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [itemId, operator],
                      properties: { itemId: { type: string }, operator: { type: string } },
                    },
                },
            },
        }
      responses: { '204': { description: Granted } }
  /admin/v1/catalog/{itemId}/price:
    put:
      security: [{ admin: [] }]
      summary: 'Operator: set the active price of an item (the founder supplies every real price; none exists today)'
      parameters: [{ name: itemId, in: path, required: true, schema: { type: string } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [currency, amountMinor, operator],
                      properties:
                        {
                          currency: { type: string, example: NGN },
                          amountMinor: { type: integer, minimum: 1 },
                          operator: { type: string },
                        },
                    },
                },
            },
        }
      responses: { '204': { description: Set } }
  /admin/v1/catalog/{itemId}/sale:
    put:
      security: [{ admin: [] }]
      summary: 'Operator: mark an item sellable (or not). Earned and default items need a deliberate decision'
      parameters: [{ name: itemId, in: path, required: true, schema: { type: string } }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [purchasable, operator],
                      properties: { purchasable: { type: boolean }, operator: { type: string } },
                    },
                },
            },
        }
      responses: { '204': { description: Set } }
  /admin/v1/catalog/{itemId}/store-products/{provider}:
    put:
      security: [{ admin: [] }]
      summary: 'Operator: the product id this item has in a store (Apple, Google, web)'
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [apple, google, web] } }
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [productId, operator],
                      properties: { productId: { type: string }, operator: { type: string } },
                    },
                },
            },
        }
      responses: { '204': { description: Set } }
