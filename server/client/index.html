<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>WAHALA! City Rumble Online (dev client)</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="game" aria-label="City Rumble arena"></canvas>

    <!-- in-match overlay: filled with textContent only -->
    <div id="hud" hidden>
      <div class="hud-top">
        <span id="hud-code"></span>
        <span id="hud-who"></span>
        <span id="hud-net"></span>
        <span id="hud-alive"></span>
        <span id="hud-kd"></span>
        <span id="hud-time"></span>
      </div>
      <ul id="hud-feed"></ul>
    </div>
    <div id="banner" hidden role="status">Reconnecting…</div>

    <div id="touch" hidden>
      <div id="stick"><div id="stick-knob"></div></div>
      <button id="btn-b" type="button" aria-label="B: special">B</button>
      <button id="btn-a" type="button" aria-label="A: place generator">A</button>
    </div>

    <!-- entry: name, character, create / join / quick play -->
    <main id="screen-entry" class="panel">
      <h1>WAHALA! City Rumble <small>online (dev)</small></h1>
      <p id="invite" class="invite" hidden></p>
      <label for="name">Your name</label>
      <input
        id="name"
        type="text"
        maxlength="24"
        autocomplete="off"
        spellcheck="false"
        placeholder="2-24 letters"
      />
      <div id="characters" class="row" role="radiogroup" aria-label="Fighter"></div>
      <div class="row">
        <button id="btn-create" type="button" class="primary">Create private room</button>
        <button id="btn-quick" type="button">Quick play</button>
      </div>
      <div class="row">
        <input
          id="code"
          type="text"
          maxlength="8"
          autocomplete="off"
          spellcheck="false"
          placeholder="ROOM CODE"
          aria-label="Room code"
        />
        <button id="btn-join" type="button">Join by code</button>
      </div>
      <p id="loading" class="muted">Loading graphics…</p>
      <p id="entry-error" class="error" role="alert"></p>
      <p class="muted">Server: <span id="server-url"></span></p>
    </main>

    <!-- room lobby -->
    <main id="screen-room" class="panel" hidden>
      <div class="row between">
        <div>
          <div class="muted">Room code</div>
          <div id="room-code" class="code"></div>
        </div>
        <div class="col">
          <button id="btn-copy" type="button">Copy invite link</button>
          <button id="btn-leave" type="button">Leave</button>
        </div>
      </div>
      <ul id="members" class="members"></ul>
      <p id="bots-note" class="muted"></p>
      <fieldset id="settings">
        <legend>Match</legend>
        <label
          >Arena
          <select id="set-arena"></select
        ></label>
        <label
          >Mode
          <select id="set-game"></select
        ></label>
        <label
          >Length
          <select id="set-duration"></select
        ></label>
        <label
          >Bot level
          <select id="set-bots"></select
        ></label>
      </fieldset>
      <p id="settings-readonly" class="muted" hidden></p>
      <div class="row">
        <button id="btn-ready" type="button">Ready</button>
        <button id="btn-start" type="button" class="primary">Start</button>
      </div>
      <p id="countdown" class="countdown" role="status"></p>
      <p id="room-note" class="error" role="alert"></p>
    </main>

    <!-- results -->
    <main id="screen-results" class="panel wide" hidden>
      <h2 id="results-title">Results</h2>
      <div class="scroll">
        <table id="results-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Fighter</th>
              <th>K</th>
              <th>D</th>
              <th>A</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="results-hash" class="muted"></p>
      <div class="row">
        <button id="btn-rematch" type="button" class="primary">Rematch</button>
        <button id="btn-results-leave" type="button">Leave</button>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
